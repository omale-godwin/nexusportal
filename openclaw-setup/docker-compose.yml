
services:

  # ---------------------------------------------------------------------------
  # OPENCLAW - AI Agent Gateway
  # Official image: ghcr.io/openclaw/openclaw:latest
  # Web dashboard on port 18789, internal gateway API on 18793.
  # The CLI sidecar (openclaw-cli) shares the gateway network namespace so
  # CLI commands reach the gateway reliably over 127.0.0.1.
  # ---------------------------------------------------------------------------
  # One-shot init container — runs before the gateway, fixes volume ownership.
  # Docker named volumes are created as root:root. OpenClaw runs as node (UID
  # 1000 / GID 1000) and cannot write to them without this fix.
  # Automatically skipped on subsequent starts because the condition is met.
  openclaw-init:
    image: busybox:latest
    container_name: openclaw-init
    restart: "no"
    entrypoint: >
      sh -c "
        chown -R 1000:1000 /home/node/.openclaw &&
        chown -R 1000:1000 /home/node/openclaw/workspace &&
        echo 'OpenClaw volume permissions fixed.'
      "
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/openclaw/workspace
      - openclaw_data:/home/node/.openclaw/data

  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    user: "1000:1000"   # run as node — matches the image's node user
    environment:
      NODE_ENV: production
      # LLM provider keys — add whichever you use
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Messaging channel tokens
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      # Gateway token locks the web dashboard
      GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      # Trust Nginx proxy headers
      OPENCLAW_TRUSTED_PROXIES: "nginx"
    volumes:
      - .openclaw_config:/home/node/.openclaw
      - ./openclaw_workspace:/home/node/openclaw/workspace
      - ./openclaw_data:/home/node/.openclaw/data
    expose:
      - "8789:18789"  
      - "8793:18793"  
    networks:
      
      - openclaw_net
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    depends_on:
      openclaw-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:18789"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-cli
    network_mode: "service:openclaw-gateway"
    user: "1000:1000"
    restart: "no"
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - ./openclaw_config:/home/node/.openclaw
      - ./openclaw_workspace:/home/node/openclaw/workspace
      - ./openclaw_data:/home/node/.openclaw/data
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    depends_on:
      - openclaw-gateway
    profiles:
      - cli


  
networks:
  openclaw_net:
    driver: bridge
    name: openclaw_net


# ---------------------------------------------------------------------------
# VOLUMES
# ---------------------------------------------------------------------------
volumes:
  openclaw_config:
    driver: local
  openclaw_workspace:
    driver: local
  openclaw_data:
    driver: local

