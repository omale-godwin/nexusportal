
services:
  # ---------------------------------------------------------------------------
  # POSTGRESQL FOR METABASE - With Host Volume Mapping
  # ---------------------------------------------------------------------------
  postgres-metabase-nexus:
    image: postgres:15-alpine
    container_name: postgres-metabase-nexus
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_METABASE_USER}
      POSTGRES_PASSWORD: ${PG_METABASE_PASSWORD}
      POSTGRES_DB: ${PG_METABASE_DB:-metabase_main}
    volumes:
      # Map to current directory ./postgres-data for easy backups
      - ./postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "6433:5432"
    networks:
      - metabase_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_METABASE_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

