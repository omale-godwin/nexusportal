  # ---------------------------------------------------------------------------
  # METABASE INSTANCE 2 - Analytics Dashboard
  # ---------------------------------------------------------------------------
  metabase2:
    image: metabase/metabase:latest
    container_name: metabase2
    restart: unless-stopped
    depends_on:
      postgres-metabase:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres-metabase
      MB_DB_PORT: 6432
      MB_DB_DBNAME: ${METABASE2_DB_NAME}
      MB_DB_USER: ${PG_METABASE_USER}
      MB_DB_PASS: ${PG_METABASE_PASSWORD}
      
      MB_ENCRYPTION_SECRET_KEY: ${METABASE2_ENCRYPTION_KEY}
      MB_SITE_NAME: ${METABASE2_SITE_NAME:-"Analytics Dashboard"}
      MB_SITE_URL: ${METABASE2_SITE_URL}
      
      MB_JETTY_HOST: 0.0.0.0
      MB_JETTY_PORT: 3000
      MB_ANON_TRACKING_ENABLED: "false"
      MB_PASSWORD_COMPLEXITY: ${METABASE_PASSWORD_COMPLEXITY:-normal}
      MB_SESSION_COOKIE_SAMESITE: lax
      
      JAVA_OPTS: >-
        -Xmx${METABASE2_HEAP_MAX:-2g} 
        -Xms${METABASE2_HEAP_MIN:-512m}
        -Djava.security.egd=file:/dev/./urandom
    volumes:
      - ./metabase2-data:/metabase-data
      - ./metabase2-plugins:/plugins
    ports:
      - "${METABASE2_PORT:-3030}:3000"
    networks:
      - metabase_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  metabase_net:
    driver: bridge
    name: metabase_net