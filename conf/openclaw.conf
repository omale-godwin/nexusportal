# nginx/conf.d/openclaw.conf
server {
    listen 443 ssl;
    server_name openclaw.DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Larger buffer for OpenClaw streaming responses
    proxy_buffering    off;
    proxy_read_timeout 600s;

    location / {
        proxy_pass         http://openclaw-gateway:18789;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket support (OpenClaw UI uses WS)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
