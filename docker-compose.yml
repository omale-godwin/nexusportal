
services:
  # ---------------------------------------------------------------------------
  # FLOWISEAI - LLM Workflow / Agent Builder
  # ---------------------------------------------------------------------------
  flowise:
    image: flowiseai/flowise:latest
    container_name: flowise
    restart: unless-stopped
    ports:
      - "3012:3000"
    environment:
      PORT: 3000
      FLOWISE_SIGNUP_DISABLED: "true"
      FLOWISE_SECRETKEY_OVERWRITE: ${FLOWISE_SECRET_KEY}
      DATABASE_TYPE: mongodb
      DATABASE_MONGO_URI: ${FLOWISE_MONGODB_URI}
      APIKEY_PATH: /data/api-keys
      SECRETKEY_PATH: /data/secret-keys
      LOG_PATH: /data/logs
      BLOB_STORAGE_PATH: /data/uploads
      TOOL_FUNCTION_BUILTIN_DEP: crypto,fs
      TOOL_FUNCTION_EXTERNAL_DEP: moment,lodash
      NODE_ENV: production
      FLOWISE_CORS_ORIGINS: "*"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_BASE_URL: https://api.x.ai/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - flowise_data:/data
      - flowise_uploads:/data/uploads
    networks:
      - nginx_net
      - flowise_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # OPENCLAW - AI Agent Gateway
  # ---------------------------------------------------------------------------
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_TRUSTED_PROXIES: "nginx"
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/openclaw/workspace
      - openclaw_data:/home/node/.openclaw/data
    ports:
      - "18789:18789"
      - "18793:18793"
    networks:
      - nginx_net
      - openclaw_net
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:18789"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-cli
    network_mode: "service:openclaw-gateway"
    restart: "no"
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/openclaw/workspace
      - openclaw_data:/home/node/.openclaw/data
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    depends_on:
      - openclaw-gateway
    profiles:
      - cli

  # ---------------------------------------------------------------------------
  # DIRECTUS CMS - Headless CMS
  # ---------------------------------------------------------------------------
  directus:
    image: directus/directus:latest
    container_name: directus
    restart: unless-stopped
    environment:
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: mysql
      DB_HOST: ${DIRECTUS_DB_HOST}
      DB_PORT: ${DIRECTUS_DB_PORT:-25060}
      DB_DATABASE: ${DIRECTUS_DB_NAME}
      DB_USER: ${DIRECTUS_DB_USER}
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD}
      DB_SSL__REJECT_UNAUTHORIZED: "false"
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: "http://129.212.146.116:8055"
      CORS_ENABLED: "false"
      CORS_ORIGIN: "*"
      REFRESH_TOKEN_COOKIE_SECURE: "false"
      REFRESH_TOKEN_COOKIE_SAME_SITE: "lax"
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      CACHE_ENABLED: "true"
      CACHE_STORE: memory
      LOG_LEVEL: debug
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      EMAIL_SMTP_HOST: ${SMTP_HOST}
      EMAIL_SMTP_PORT: ${SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${SMTP_PASSWORD}
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_POINTS: 100
      RATE_LIMITER_DURATION: 1
      IP_TRUST_PROXY: "true"
      IP_CUSTOM_HEADER: "X-Forwarded-For"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
      - directus_templates:/directus/templates
      - directus_logs:/directus/logs
    ports:
      - "8055:8055"
    networks:
      - nginx_net
      - directus_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8055/server/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  
networks:
  nginx_net:
    driver: bridge
    name: nginx_net
  flowise_net:
    driver: bridge
    name: flowise_net
  openclaw_net:
    driver: bridge
    name: openclaw_net
  directus_net:
    driver: bridge
    name: directus_net


# ---------------------------------------------------------------------------
# VOLUMES
# ---------------------------------------------------------------------------
volumes:
  nginx_logs:
    driver: local
  flowise_data:
    driver: local
  flowise_uploads:
    driver: local
  openclaw_config:
    driver: local
  openclaw_workspace:
    driver: local
  openclaw_data:
    driver: local
  directus_uploads:
    driver: local
  directus_extensions:
    driver: local
  directus_templates:
    driver: local
  directus_logs:
    driver: local

