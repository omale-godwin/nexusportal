
services:

  # ---------------------------------------------------------------------------
  # DIRECTUS CMS - Headless CMS
  # ---------------------------------------------------------------------------
  directus:
    image: directus/directus:latest
    container_name: directus
    restart: unless-stopped
    environment:
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: mysql
      AUTH_DISABLE_DEFAULT: "false"
      DB_HOST: ${DIRECTUS_DB_HOST}
      DB_PORT: ${DIRECTUS_DB_PORT:-25060}
      DB_DATABASE: ${DIRECTUS_DB_NAME}
      DB_USER: ${DIRECTUS_DB_USER}
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD}
      DB_SSL__REJECT_UNAUTHORIZED: "false"
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: "http://129.212.146.116:8055"
      CORS_ENABLED: "false"
      CORS_ORIGIN: "*"
      IP_TRUST_PROXY: "false"
      REFRESH_TOKEN_COOKIE_SECURE: "false"
      REFRESH_TOKEN_COOKIE_SAME_SITE: "lax"
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      CACHE_ENABLED: "true"
      CACHE_STORE: memory
      LOG_LEVEL: debug
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      EMAIL_SMTP_HOST: ${SMTP_HOST}
      EMAIL_SMTP_PORT: ${SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${SMTP_PASSWORD}
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_POINTS: 100
      RATE_LIMITER_DURATION: 1
      # IP_TRUST_PROXY: "true"
      # IP_CUSTOM_HEADER: "X-Forwarded-For"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
      - directus_templates:/directus/templates
      - directus_logs:/directus/logs
    ports:
      - "8055:8055"
    networks:
     
      - directus_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8055/server/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  

  # ---------------------------------------------------------------------------
  # OPENCLAW - AI Agent Gateway
  # Official image: ghcr.io/openclaw/openclaw:latest
  # Web dashboard on port 18789, internal gateway API on 18793.
  # The CLI sidecar (openclaw-cli) shares the gateway network namespace so
  # CLI commands reach the gateway reliably over 127.0.0.1.
  # ---------------------------------------------------------------------------
  # One-shot init container — runs before the gateway, fixes volume ownership.
  # Docker named volumes are created as root:root. OpenClaw runs as node (UID
  # 1000 / GID 1000) and cannot write to them without this fix.
  # Automatically skipped on subsequent starts because the condition is met.
  openclaw-init:
    image: busybox:latest
    container_name: openclaw-init
    restart: "no"
    entrypoint: >
      sh -c "
        chown -R 1000:1000 /home/node/.openclaw &&
        chown -R 1000:1000 /home/node/openclaw/workspace &&
        echo 'OpenClaw volume permissions fixed.'
      "
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/openclaw/workspace
      - openclaw_data:/home/node/.openclaw/data


  
networks:
  directus_net:
    driver: bridge
    name: directus_net



# ---------------------------------------------------------------------------
# VOLUMES
# ---------------------------------------------------------------------------
volumes:
  directus_uploads:
    driver: local
  directus_extensions:
    driver: local
  directus_templates:
    driver: local
  directus_logs:
    driver: local
  

